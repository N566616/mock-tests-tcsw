<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mock Tests</title>
<style>
:root{--bg:#f3f5f1;--fg:#1d2a24;--card:#fff;--line:#cdd6cf;--muted:#5d6b63;--acc:#1f5d4a;--accfg:#fff;--badb:#c0392b}

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 22px;text-align:center}
h1{font-size:1.5rem;margin:.1em 0 .2em}p{margin:.3em 0 1em;color:var(--muted)}
input{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;width:100%;margin-top:12px;background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}#err{color:var(--badb);min-height:1.5em;margin:.7em 0 0;font-size:.95rem}
</style></head><body>

async function unlock(p,silent){
 try{
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
