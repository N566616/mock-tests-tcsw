.why{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--bg);font-size:.95rem}

.btn.alt{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.score{font-size:2.4rem;font-weight:bold;margin:.1em 0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
summary{cursor:pointer;font-weight:bold}
ul{padding-left:1.2em}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.card{text-align:center;min-height:220px}.card .big{font-size:1.9rem;margin:.3em 0 .5em}.card .row{text-align:left;margin:.5em 0}
.nm{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:0 8px 8px 0;max-width:100%}

 const q=Q[order[i]],opts=shuffle([q[1],...q[2]]);
 fill.style.width=(i/order.length*100)+"%";
 pos.textContent="Question "+(i+1)+" of "+order.length;sc.textContent="Score: "+score;
 app.innerHTML="";
 const box=document.createElement("div");box.className="q";
 const h=document.createElement("h3");h.textContent=q[0];box.appendChild(h);
 opts.forEach(o=>{
  const b=document.createElement("button");b.className="opt";b.textContent=o;
  b.onclick=()=>pick(b,o,q,box);box.appendChild(b)});
 app.appendChild(box);
 const q2=document.createElement("button");q2.className="btn alt";q2.textContent="Main menu";q2.onclick=home;app.appendChild(q2);
}
function pick(btn,o,q,box){
 const right=o===q[1];
 if(right)score++;else missed.push(order[i]);
 box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q[1])b.classList.add("ok")});
 if(!right)btn.classList.add("bad");
 sc.textContent="Score: "+score;
 const w=document.createElement("div");w.className="why";
 w.textContent=(right?"Correct. ":"Not quite. ")+q[3];box.appendChild(w);
 const n=document.createElement("button");n.className="btn";
 n.textContent=i===order.length-1?"See results":"Next question";
 n.onclick=()=>{i++;show()};box.appendChild(n);n.focus();
}
function done(){
 fill.style.width="100%";pos.textContent="Finished";sc.textContent="";
 const pct=Math.round(score/order.length*100);
 let html='<div class="q"><p class="sub">Multiple choice result</p><div class="score">'+score+' / '+order.length+' ('+pct+'%)</div>';
 if(missed.length){html+='<h2>Review what you missed</h2><ul>';
  missed.forEach(k=>{html+='<li><b>'+Q[k][0]+'</b><br>Answer: '+Q[k][1]+'</li>'});html+='</ul>'}
 else html+='<p>Perfect score. Nothing to review.</p>';
 html+='<button class="btn" id="again">Retake this unit</button> <button class="btn alt" id="toHome">Main menu</button></div>'+(W.length?'<h2>Written response</h2><p class="sub">Write your own answer first, then open the model answer to compare.</p>':'');
 W.forEach((w,k)=>{html+='<details><summary>'+(k+1)+'. '+w[0]+'</summary><p>'+w[1]+'</p></details>'});
 app.innerHTML=html;
 document.getElementById("again").onclick=start;document.getElementById("toHome").onclick=home;lbSubmit();
}
function begin(us,name){
 curKey=name||us[0].name;
 Q=[].concat(...us.map(u=>u.Q));W=[].concat(...us.map(u=>u.W));
 document.getElementById("sub").textContent=name||(us.length>1?"All units mixed":us[0].name);start();
}
function reset(msg){fill.style.width="0";pos.textContent="";sc.textContent="";document.getElementById("sub").textContent=msg;app.innerHTML=""}
function item(title,detail,fn){const b=el("button","opt");b.innerHTML="<b></b><br><span class='sub'></span>";b.children[0].textContent=title;b.children[2].textContent=detail;b.onclick=fn;app.appendChild(b)}
function back(){const b=el("button","btn alt","\u2190 Main menu");b.onclick=home;app.appendChild(b)}
const cnt=us=>us.reduce((n,u)=>n+u.Q.length,0);
const info=u=>u.Q.length+" multiple choice"+(u.W.length?", "+u.W.length+" written prompts":"");
function home(){
 reset("Pick a subject.");
 const ss=UNITS.filter(u=>u.s==="ss"),en=UNITS.filter(u=>u.s==="en");
 item("Social Studies","Unit practice tests",menuSS);
 item("English",en.length+" vocabulary tests, plus a combined test",menuEng);
 item("Flashcards","Vocabulary flashcards, including a mega deck",menuCards);
 if(sbOn())item("Leaderboard","Top scores from everyone",menuLB);
}
function startSS(){const ss=UNITS.filter(u=>u.s==="ss");begin([ss[Math.floor(Math.random()*ss.length)]],"Purpose & Origin of Government")}
function menuSS(){
 reset("Social Studies");
 item("Purpose & Origin of Government","Practice test",startSS);
 back();
}
function menuEng(){
 reset("English");
 const v=UNITS.filter(u=>u.s==="en");
 v.forEach(u=>item(u.name,info(u),()=>begin([u])));
 item("Vocabulary Test: Units 1, 2, & 3",cnt(v)+" multiple choice questions from all three units",()=>begin(v,"Vocabulary Test: Units 1, 2, & 3"));
 back();
}
function menuCards(){
 reset("Flashcards");
 const v=UNITS.filter(u=>u.C);
 v.forEach(u=>item("Flashcards: "+u.name,u.C.length+" words",()=>cards(u)));
 const mega={name:"Flashcards Mega 1: Units 1, 2, & 3",C:[].concat(...v.map(u=>u.C))};
 item(mega.name,mega.C.length+" words from all three units",()=>cards(mega));
 back();
}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function addCards(u){
 const b=el("button","opt");b.innerHTML="<b></b><br><span class='sub'></span>";
 b.children[0].textContent="Flashcards: "+u.name;b.children[2].textContent=u.C.length+" words to flip and review";
 b.onclick=()=>cards(u);app.appendChild(b);
}
function cards(u){
 let deck=shuffle(u.C),i=0,flip=false,learn=[];
 document.getElementById("sub").textContent=u.name.startsWith("Flashcards")?u.name:"Flashcards: "+u.name;
 const draw=()=>{
  if(i>=deck.length)return finish();
  fill.style.width=(i/deck.length*100)+"%";pos.textContent="Card "+(i+1)+" of "+deck.length;sc.textContent="Still learning: "+learn.length;
  app.innerHTML="";
  const c=deck[i],box=el("div","q card");
  box.appendChild(el("h3","big",c[0]));
  if(!flip){
   box.appendChild(el("p","sub","Think of the meaning, then flip."));
   const b=el("button","btn","Flip card");b.onclick=()=>{flip=true;draw()};box.appendChild(b);
  }else{
   [["Meaning",c[1]],["Synonyms",c[2].join(", ")],["Antonyms",c[3].join(", ")],["Example",c[4]]].forEach(r=>{
    const p=el("p","row");p.appendChild(el("b",null,r[0]+": "));p.appendChild(document.createTextNode(r[1]));box.appendChild(p)});
   const a=el("button","btn","Got it");a.onclick=()=>{flip=false;i++;draw()};
   const l=el("button","btn alt","Still learning");l.onclick=()=>{learn.push(c);flip=false;i++;draw()};
   box.appendChild(a);box.appendChild(document.createTextNode(" "));box.appendChild(l);
  }
  app.appendChild(box);
  const q=el("button","btn alt","Main menu");q.onclick=home;app.appendChild(q);
 };
 const finish=()=>{
  fill.style.width="100%";pos.textContent="Finished";sc.textContent="";app.innerHTML="";
  const box=el("div","q");box.appendChild(el("p","sub","Flashcards done"));
  box.appendChild(el("div","score",(deck.length-learn.length)+" got it, "+learn.length+" still learning"));
  if(learn.length){const r=el("button","btn","Review still learning");r.onclick=()=>{deck=shuffle(learn);learn=[];i=0;draw()};box.appendChild(r)}
  const a=el("button","btn alt","Start over");a.onclick=()=>cards(u);
  const h=el("button","btn alt","Main menu");h.onclick=home;
  box.appendChild(document.createTextNode(" "));box.appendChild(a);box.appendChild(document.createTextNode(" "));box.appendChild(h);
  app.appendChild(box);
 };
 draw();
}
home();
</script>
</body>
</html>
