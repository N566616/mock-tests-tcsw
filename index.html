<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock Tests</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f1;--fg:#1d2a24;--card:#fff;--line:#cdd6cf;--muted:#5d6b63;--acc:#1f5d4a;--accfg:#fff;--badb:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14201b;--fg:#e8efe9;--card:#1d2c25;--line:#33463d;--muted:#9fb1a6;--acc:#6fcaa8;--accfg:#0f1a15;--badb:#e0675a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 22px;text-align:center}
h1{font-size:1.5rem;margin:.1em 0 .2em}
p{margin:.3em 0 1em;color:var(--muted)}
input{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;width:100%;margin-top:12px;background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{color:var(--badb);min-height:1.5em;margin:.7em 0 0;font-size:.95rem}
</style>
</head>
<body>
<div class="box">
<h1>Mock Tests</h1>
<p>Enter the class password to continue.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<button id="go">Unlock</button>
<div id="err" role="alert"></div>
</div>

const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
async function unlock(p,silent){
 try{
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
  const html=new TextDecoder().decode(buf);
  try{sessionStorage.setItem("mt_pw",p)}catch(e){}
  document.open();document.write(html);document.close();
  return true;
 }catch(e){
  if(!silent)err.textContent=(window.crypto&&crypto.subtle)?"Incorrect password. Try again.":"This page must be opened over https.";
  return false;
 }
}
async function submit(){
 if(!pw.value)return;
 go.disabled=true;err.textContent="";
 const ok=await unlock(pw.value,false);
 if(!ok){go.disabled=false;pw.select()}
}
go.onclick=submit;
pw.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
try{const s=sessionStorage.getItem("mt_pw");if(s)unlock(s,true)}catch(e){}
</script>
